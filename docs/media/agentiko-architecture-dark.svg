<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="AGENTIKO proposes a change; Krateo PlatformOps proves it; a person decides; Krateo PlatformOps applies it and the loop closes." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="adark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs><rect width="960" height="470" rx="14" fill="#0d1117" stroke="#30363d"/><rect x="20" y="20" width="920" height="170" rx="12" fill="#1c1846"/><text x="40" y="50" fill="#8f86ff" font-size="13" font-weight="700" letter-spacing="1.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">AGENTIKO · REASONING PLANE</text><rect x="20" y="236" width="920" height="170" rx="12" fill="#0f2b39"/><text x="40" y="266" fill="#4cc0ec" font-size="13" font-weight="700" letter-spacing="1.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">KRATEO PLATFORMOPS · CONTROL PLANE (OPEN SOURCE)</text><rect x="40" y="66" width="270" height="104" rx="10" fill="#161b22" stroke="#8f86ff" stroke-width="1.5"/><text x="56" y="96" fill="#f0f6fc" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Reads the platform</text><text x="56" y="120" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">compositions, events,</text><text x="56" y="140" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">resources and their state</text><rect x="345" y="66" width="270" height="104" rx="10" fill="#161b22" stroke="#8f86ff" stroke-width="1.5"/><text x="361" y="96" fill="#f0f6fc" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Investigates</text><text x="361" y="120" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">finds the cause and</text><text x="361" y="140" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">cites the evidence</text><rect x="650" y="66" width="270" height="104" rx="10" fill="#161b22" stroke="#8f86ff" stroke-width="1.5"/><text x="666" y="96" fill="#f0f6fc" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Proposes the change</text><text x="666" y="120" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">the full object to declare,</text><text x="666" y="140" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">never written on its own</text><line x1="310" y1="118" x2="343" y2="118" stroke="#8b949e" stroke-width="2" marker-end="url(#adark)"/><line x1="615" y1="118" x2="648" y2="118" stroke="#8b949e" stroke-width="2" marker-end="url(#adark)"/><line x1="785" y1="170" x2="785" y2="280" stroke="#8f86ff" stroke-width="2" marker-end="url(#adark)"/><text x="795" y="222" fill="#8f86ff" font-size="13" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">proposal</text><rect x="650" y="282" width="270" height="104" rx="10" fill="#161b22" stroke="#4cc0ec" stroke-width="1.5"/><text x="666" y="312" fill="#f0f6fc" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">1 · Proves it</text><text x="666" y="336" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">lint · Helm render</text><text x="666" y="356" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">schema · server dry-run</text><rect x="345" y="282" width="270" height="104" rx="10" fill="#161b22" stroke="#4cc0ec" stroke-width="1.5"/><text x="361" y="312" fill="#f0f6fc" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">2 · A person decides</text><text x="361" y="336" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">explicit confirmation or</text><text x="361" y="356" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">merge of the pull request</text><rect x="40" y="282" width="270" height="104" rx="10" fill="#161b22" stroke="#4cc0ec" stroke-width="1.5"/><text x="56" y="312" fill="#f0f6fc" font-size="16" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">3 · Applies and keeps it true</text><text x="56" y="336" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">reconciles to the desired</text><text x="56" y="356" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">state; the loop closes</text><line x1="648" y1="334" x2="617" y2="334" stroke="#8b949e" stroke-width="2" marker-end="url(#adark)"/><line x1="343" y1="334" x2="312" y2="334" stroke="#8b949e" stroke-width="2" marker-end="url(#adark)"/><text x="40" y="440" fill="#8b949e" font-size="13.5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Agents act with the permissions of the person who uses them. No change is written without a person approving it.</text></svg>